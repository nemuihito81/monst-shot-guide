<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>モンスト 反射・貫通 予測ガイド</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-bottom: 84px;
    }
    header {
      padding: 10px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
      gap: 6px;
    }
    header h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 700;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button, label.btn {
      background: #334155;
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    button:active, label.btn:active {
      transform: scale(0.97);
    }
    button.primary, label.primary { background: #0284c7; border-color: #0369a1; }
    button.auto-btn { background: #7c3aed; border-color: #6d28d9; }
    button.lock-active { background: var(--danger); border-color: #b91c1c; }
    button.success { background: #16a34a; border-color: #15803d; }

      background: rgba(124, 58, 237, 0.25);
      border-bottom: 1px solid rgba(139, 92, 246, 0.5);
      color: #ede
