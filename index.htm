<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>モンスト 反射・貫通 予測ガイド</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-bottom: 84px;
    }
    header {
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 700;
    }
    .top-actions {
      display: flex;
      gap: 6px;
    }
    button, label.btn {
      background: #334155;
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    button:active, label.btn:active {
      transform: scale(0.97);
    }
    button.primary, label.primary { background: #0284c7; border-color: #0369a1; }
    button.lock-active { background: var(--danger); border-color: #b91c1c; }
    button.success { background: #16a34a; border-color: #15803d; }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 62dvh;
      object-fit: contain;
    }
    .placeholder {
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .controls {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .row:last-child { margin-bottom: 0; }
    .label {
      font-size: 12px;
      color: var(--muted);
      min-width: 56px;
    }
    .value-badge {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      min-width: 54px;
      text-align: right;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 24px;
    }
    .step-btns {
      display: flex;
      gap: 4px;
    }
    .step-btns button {
      padding: 6px 9px;
      font-size: 12px;
    }

    .seg-control {
      display: flex;
      background: #0f172a;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .seg-control button {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 6px;
      color: var(--muted);
    }
    .seg-control button.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    details summary {
      font-size: 12px;
      font-weight: 600;
      color: var(--warning);
      cursor: pointer;
    }
    .wall-grid {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 30;
    }
    .bottom-bar-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
    }
    .bottom-bar button {
      flex: 1;
      padding: 11px 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <h1>弾道予測シミュレーター</h1>
  <div class="top-actions">
    <label class="btn primary">
      画像読込
      <input type="file" id="fileInput" accept="image/*" hidden />
    </label>
    <button id="pasteBtn">貼付</button>
    <button id="shareBtn" class="success">共有/保存</button>
  </div>
</header>

<div class="canvas-wrapper" id="canvasWrapper">
  <div class="placeholder" id="placeholder">
    「画像読込」からモンストのスクショを選択するか、<br>
    スクショをコピーして「貼付」を押してください。
  </div>
  <canvas id="canvas" style="display:none;"></canvas>
</div>

<div class="controls">
  <div class="card">
    <div class="row">
      <span class="label">撃種</span>
      <div class="seg-control">
        <button id="typeReflect" class="active">反射</button>
        <button id="typePierce">貫通</button>
      </div>
      <span class="label" style="min-width:auto;margin-left:auto;">反射数</span>
      <select id="bounceSelect" style="background:#0f172a;color:#fff;border:1px solid #475569;border-radius:6px;padding:4px 6px;font-size:12px;">
        <option value="1">1回</option>
        <option value="2">2回</option>
        <option value="3">3回</option>
        <option value="5" selected>5回</option>
        <option value="8">8回</option>
        <option value="12">12回</option>
      </select>
    </div>

    <div class="row">
      <span class="label">発射角度</span>
      <input type="range" id="angleSlider" min="0" max="360" step="0.1" value="45.0" />
      <span class="value-badge" id="angleVal">45.0°</span>
    </div>
    <div class="row" style="justify-content:flex-end;">
      <div class="step-btns">
        <button data-angle="-5">-5°</button>
        <button data-angle="-1">-1°</button>
        <button data-angle="-0.1">◀ -0.1°</button>
        <button data-angle="0.1">+0.1° ▶</button>
        <button data-angle="1">+1°</button>
        <button data-angle="5">+5°</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">左右 (X)</span>
      <input type="range" id="xSlider" min="0" max="100" value="50" />
      <div class="step-btns">
        <button data-dx="-1">-1</button>
        <button data-dx="1">+1</button>
      </div>
    </div>
    <div class="row">
      <span class="label">上下 (Y)</span>
      <input type="range" id="ySlider" min="0" max="100" value="50" />
      <div class="step-btns">
        <button data-dy="-1">-1</button>
        <button data-dy="1">+1</button>
      </div>
    </div>
