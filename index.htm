<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>モンスト 反射・貫通 予測ガイド</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-bottom: 84px;
    }
    header {
      padding: 10px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
      gap: 6px;
    }
    header h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 700;
      white-space: nowrap;
    }
    .top-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button, label.btn {
      background: #334155;
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }
    button:active, label.btn:active {
      transform: scale(0.97);
    }
    button.primary, label.primary { background: #0284c7; border-color: #0369a1; }
    button.auto-btn { background: #7c3aed; border-color: #6d28d9; }
    button.lock-active { background: var(--danger); border-color: #b91c1c; }
    button.success { background: #16a34a; border-color: #15803d; }

    .status-toast {
      background: rgba(124, 58, 237, 0.25);
      border-bottom: 1px solid rgba(139, 92, 246, 0.5);
      color: #ede9fe;
      font-size: 11px;
      text-align: center;
      padding: 5px 8px;
      display: none;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 62dvh;
      object-fit: contain;
    }
    .placeholder {
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .controls {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .row:last-child { margin-bottom: 0; }
    .label {
      font-size: 12px;
      color: var(--muted);
      min-width: 56px;
    }
    .value-badge {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      min-width: 54px;
      text-align: right;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 24px;
    }
    .step-btns {
      display: flex;
      gap: 4px;
    }
    .step-btns button {
      padding: 6px 8px;
      font-size: 12px;
    }

    .seg-control {
      display: flex;
      background: #0f172a;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .seg-control button {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 6px;
      color: var(--muted);
    }
    .seg-control button.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    details summary {
      font-size: 12px;
      font-weight: 600;
      color: var(--warning);
      cursor: pointer;
    }
    .wall-grid {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 30;
    }
    .bottom-bar-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
    }
    .bottom-bar button {
      flex: 1;
      padding: 11px 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <h1>弾道予測</h1>
  <div class="top-actions">
    <label class="btn primary">
      画像読込
      <input type="file" id="fileInput" accept="image/*" hidden />
    </label>
    <button id="pasteBtn">貼付</button>
    <button id="autoDetectBtn" class="auto-btn">自動検出</button>
    <button id="shareBtn" class="success">共有</button>
  </div>
</header>
<div id="statusToast" class="status-toast"></div>

<div class="canvas-wrapper" id="canvasWrapper">
  <div class="placeholder" id="placeholder">
    「画像読込」からモンストのスクショを選択するか、<br>
    スクショをコピーして「貼付」を押してください。<br>
    <span style="color:#a78bfa;font-size:12px;">※1st/2nd下のオーラ中心を自動検出します</span>
  </div>
  <canvas id="canvas" style="display:none;"></canvas>
</div>

<div class="controls">
  <!-- 角度調整 -->
  <div class="card">
    <div class="row">
      <span class="label">撃種</span>
      <div class="seg-control">
        <button id="typeReflect" class="active">反射</button>
        <button id="typePierce">貫通</button>
      </div>
      <span class="label" style="min-width:auto;margin-left:auto;">反射数</span>
      <select id="bounceSelect" style="background:#0f172a;color:#fff;border:1px solid #475569;border-radius:6px;padding:4px 6px;font-size:12px;">
        <option value="1">1回</option>
        <option value="2">2回</option>
        <option value="3">3回</option>
        <option value="5" selected>5回</option>
        <option value="8">8回</option>
        <option value="12">12回</option>
      </select>
    </div>

    <div class="row">
      <span class="label">発射角度</span>
      <input type="range" id="angleSlider" min="0" max="360" step="0.1" value="270.0" />
      <span class="value-badge" id="angleVal">270.0°</span>
    </div>
    <div class="row" style="justify-content:flex-end;">
      <div class="step-btns">
        <button data-angle="-5">-5°</button>
        <button data-angle="-1">-1°</button>
        <button data-angle="-0.1">◀ -0.1°</button>
        <button data-angle="0.1">+0.1° ▶</button>
        <button data-angle="1">+1°</button>
        <button data-angle="5">+5°</button>
      </div>
    </div>
  </div>

  <!-- 始点座標微調整 -->
  <div class="card">
    <div class="row">
      <span class="label">左右 (X)</span>
      <input type="range" id="xSlider" min="0" max="100" value="50" />
      <div class="step-btns">
        <button data-dx="-1">-1</button>
        <button data-dx="1">+1</button>
      </div>
    </div>
    <div class="row">
      <span class="label">上下 (Y)</span>
      <input type="range" id="ySlider" min="0" max="100" value="50" />
      <div class="step-btns">
        <button data-dy="-1">-1</button>
        <button data-dy="1">+1</button>
      </div>
    </div>
  </div>

  <!-- 壁（ステージ枠）微調整 -->
  <div class="card">
    <details id="wallDetails">
      <summary>ステージ枠（壁の反射位置）の微調整</summary>
      <div class="wall-grid">
        <div class="row">
          <span class="label">上壁</span>
          <input type="range" id="wallTop" min="5" max="45" step="0.2" value="21.5" />
          <span class="value-badge" id="wallTopVal">21.5%</span>
        </div>
        <div class="row">
          <span class="label">下壁</span>
          <input type="range" id="wallBottom" min="50" max="95" step="0.2" value="65.0" />
          <span class="value-badge" id="wallBottomVal">65.0%</span>
        </div>
        <div class="row">
          <span class="label">左右余白</span>
          <input type="range" id="wallSide" min="0" max="35" step="0.2" value="22.5" />
          <span class="value-badge" id="wallSideVal">22.5%</span>
        </div>
      </div>
    </details>
  </div>
</div>

<!-- 下部固定アクションバー -->
<div class="bottom-bar">
  <div class="bottom-bar-inner">
    <button id="lockBtn">始点を固定する</button>
    <button id="resetBtn">再検出/リセット</button>
  </div>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const placeholder = document.getElementById("placeholder");
  const statusToast = document.getElementById("statusToast");

  let img = null;
  let origin = { x: 0, y: 0 };
  let detectedAuraRadius = 0;
  let angleDeg = 270.0;
  let isLocked = false;
  let isReflect = true;
  let maxBounces = 5;

  // 壁の比率 (%)（二重枠スクショにも対応しやすい初期値）
  let wall = { top: 21.5, bottom: 65.0, side: 22.5 };

  const angleSlider = document.getElementById("angleSlider");
  const angleVal = document.getElementById("angleVal");
  const xSlider = document.getElementById("xSlider");
  const ySlider = document.getElementById("ySlider");
  const lockBtn = document.getElementById("lockBtn");

  function showToast(msg) {
    statusToast.textContent = msg;
    statusToast.style.display = "block";
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => {
      statusToast.style.display = "none";
    }, 3500);
  }

  /**
   * 画像内の黒帯・余白を自動検出し、実際のゲーム画面領域を返す
   */
  function detectGameViewport(data, w, h) {
    // 縦中央付近（h * 0.35 〜 h * 0.65）で左右の黒帯を調べる
    const sampleY1 = Math.round(h * 0.35);
    const sampleY2 = Math.round(h * 0.65);

    function isDarkCol(x) {
      let dark = 0;
      let total = 0;
      for (let y = sampleY1; y <= sampleY2; y += 3) {
        const p = (y * w + x) * 4;
        total++;
        if (data[p] < 35 && data[p + 1] < 35 && data[p + 2] < 35) {
          dark++;
        }
      }
      return dark / total > 0.75;
    }

    let left = 0;
    while (left < w * 0.42 && isDarkCol(left)) left++;

    let right = w - 1;
    while (right > w * 0.58 && isDarkCol(right)) right--;

    // 黒帯がない全画面スクショの場合
    if (right - left < w * 0.35) {
      left = 0;
      right = w - 1;
    }

    const viewW = Math.max(40, right - left + 1);
    const top = Math.round(h * 0.14);
    const bottom = Math.round(h * 0.82);

    return { left, right, top, bottom, viewW };
  }

  /**
   * 「1st / 2nd / 3rd / 4th」バッジ直下にあるターンオーラ中心を自動検出
   */
  function autoDetectAuraCenter(sourceImg) {
    const scaleW = 420;
    const scale = scaleW / sourceImg.width;
    const w = scaleW;
    const h = Math.round(sourceImg.height * scale);

    const off = document.createElement("canvas");
    off.width = w;
    off.height = h;
    const octx = off.getContext("2d", { willReadFrequently: true });
    octx.drawImage(sourceImg, 0, 0, w, h);
    const data = octx.getImageData(0, 0, w, h).data;

    const vp = detectGameViewport(data, w, h);
    const unit = vp.viewW; // 実際のモンスト画面の横幅基準

    const minX = Math.max(vp.left, Math.round(vp.left + unit * 0.06));
    const maxX = Math.min(vp.right, Math.round(vp.right - unit * 0.06));
    const minY = Math.max(0, Math.round(h * 0.22));
    const maxY = Math.min(h - 1, Math.round(h * 0.72));

    const size = w * h;
    const whiteMask = new Uint8Array(size);
    const badgeColorMask = new Uint8Array(size);
    const auraMask = new Uint8Array(size);
    const yellowBarrier = new Uint8Array(size);
    const hpGreenMask = new Uint8Array(size);
    const darkMask = new Uint8Array(size);

    for (let i = 0; i < size; i++) {
      const p = i * 4;
      const r = data[p], g = data[p + 1], b = data[p + 2];

      if (r > 215 && g > 215 && b > 215) {
        whiteMask[i] = 1;
      }

      const is1stRed = r > 170 && g < 120 && b < 120 && r - g > 85;
      const is2ndOrange = r > 190 && g >= 80 && g <= 170 && b < 90 && r - g > 50;
      const is3rd4thBluePurple = b > 165 && r < 190 && b - g > 40;
      if (is1stRed || is2ndOrange || is3rd4thBluePurple) {
        badgeColorMask[i] = 1;
      }

      const isMagentaPink = r > 180 && b > 150 && g < 215 && (r - g > 30 || b - g > 20);
      const isCyanGlow = b > 190 && g > 170 && r < 220 && b - r > 15;
      const isWhiteGlow = r > 228 && g > 222 && b > 232;
      if (isMagentaPink || isCyanGlow || isWhiteGlow) {
        auraMask[i] = 1;
      }

      if (r > 205 && g > 185 && b < 165 && r - b > 55) {
        yellowBarrier[i] = 1;
      }

      if (g > 160 && r < 150 && b < 115 && g - r > 40) {
        hpGreenMask[i] = 1;
      }

      if (r < 55 && g < 55 && b < 55) {
        darkMask[i] = 1;
      }
    }

    const rInner = unit * 0.052;
    const rOuter = unit * 0.068;
    const numSamples = 36;
    const cosTable = new Float32Array(numSamples);
    const sinTable = new Float32Array(numSamples);
    for (let k = 0; k < numSamples; k++) {
      const a = (k * Math.PI * 2) / numSamples;
      cosTable[k] = Math.cos(a);
      sinTable[k] = Math.sin(a);
    }

    function evaluateCandidate(cx, cy) {
      // 1. ワープホール中心の黒除外
      let darkCount = 0;
      const coreR = Math.max(2, Math.round(unit * 0.022));
      for (let dy = -coreR; dy <= coreR; dy += 2) {
        for (let dx = -coreR; dx <= coreR; dx += 2) {
          const idx = (cy + dy) * w + (cx + dx);
          if (idx >= 0 && idx < size && darkMask[idx]) darkCount++;
        }
      }
      if (darkCount > 8) return -1;

      // 2. 敵のHPバー除外
      const hpY1 = Math.min(h - 1, Math.round(cy + unit * 0.045));
      const hpY2 = Math.min(h - 1, Math.round(cy + unit * 0.095));
      const hpX1 = Math.max(0, Math.round(cx - unit * 0.05));
      const hpX2 = Math.min(w - 1, Math.round(cx + unit * 0.05));
      let hpHits = 0;
      for (let y = hpY1; y <= hpY2; y++) {
        for (let x = hpX1; x <= hpX2; x++) {
          if (hpGreenMask[y * w + x]) hpHits++;
        }
      }
      if (hpHits >= 5) return -1;

      // 3. 「1st / 2nd / 3rd / 4th」バッジが直上〜左上に存在するか
      const bx1 = Math.max(0, Math.round(cx - unit * 0.072));
      const bx2 = Math.min(w - 1, Math.round(cx + unit * 0.030));
      const by1 = Math.max(0, Math.round(cy - unit * 0.088));
      const by2 = Math.max(0, Math.round(cy - unit * 0.025));

      let whiteCnt = 0;
      let colorCnt = 0;
      let minTextX = bx2, maxTextX = bx1;

      for (let y = by1; y <= by2; y++) {
        const rowOffset = y * w;
        for (let x = bx1; x <= bx2; x++) {
          const idx = rowOffset + x;
          if (whiteMask[idx]) whiteCnt++;
          if (badgeColorMask[idx]) {
            colorCnt++;
            if (x < minTextX) minTextX = x;
            if (x > maxTextX) maxTextX = x;
          }
        }
      }

      const textWidth = maxTextX - minTextX;
      if (whiteCnt < 7 || colorCnt < 3 || textWidth < unit * 0.018) return -1;

      const badgeScore = Math.min(45, whiteCnt) + Math.min(60, colorCnt * 2.5);

      // 4. キャラ外周のオーラリング評価
      let auraHits = 0;
      let yellowHits = 0;
      const quadHits = [0, 0, 0, 0];

      for (let k = 0; k < numSamples; k++) {
        const q = Math.floor((k * 4) / numSamples);
        const x1 = Math.round(cx + cosTable[k] * rInner);
        const y1 = Math.round(cy + sinTable[k] * rInner);
        const x2 = Math.round(cx + cosTable[k] * rOuter);
        const y2 = Math.round(cy + sinTable[k] * rOuter);

        let hit = 0;
        if (x1 >= 0 && x1 < w && y1 >= 0 && y1 < h) {
          const idx1 = y1 * w + x1;
          if (auraMask[idx1]) hit++;
          if (yellowBarrier[idx1]) yellowHits++;
        }
        if (x2 >= 0 && x2 < w && y2 >= 0 && y2 < h) {
          const idx2 = y2 * w + x2;
          if (auraMask[idx2]) hit++;
          if (yellowBarrier[idx2]) yellowHits++;
        }
        if (hit > 0) {
          auraHits += hit;
          quadHits[q] += hit;
        }
      }

      if (yellowHits > auraHits) return -1;
      if (auraHits < 8) return -1;

      const activeQuads = quadHits.filter((v) => v > 0).length;
      const quadBonus = activeQuads === 4 ? 1.6 : activeQuads === 3 ? 1.15 : 0.6;

      return badgeScore * auraHits * quadBonus;
    }

    let bestScore = -1;
    let bestX = Math.round((vp.left + vp.right) * 0.5);
    let bestY = Math.round(h * 0.58);

    for (let cy = minY; cy <= maxY; cy += 2) {
      for (let cx = minX; cx <= maxX; cx += 2) {
        const sc = evaluateCandidate(cx, cy);
        if (sc > bestScore) {
          bestScore = sc;
          bestX = cx;
          bestY = cy;
        }
      }
    }

    if (bestScore > 0) {
      const searchR = 4;
      const startX = bestX, startY = bestY;
      for (let cy = startY - searchR; cy <= startY + searchR; cy++) {
        for (let cx = startX - searchR; cx <= startX + searchR; cx++) {
          if (cx < minX || cx > maxX || cy < minY || cy > maxY) continue;
          const sc = evaluateCandidate(cx, cy);
          if (sc > bestScore) {
            bestScore = sc;
            bestX = cx;
            bestY = cy;
          }
        }
      }
      return {
        found: true,
        x: Math.round(bestX / scale),
        y: Math.round(bestY / scale),
        radius: Math.round(((rInner + rOuter) * 0.5) / scale)
      };
    }

    return {
      found: false,
      x: Math.round((vp.left + vp.right) * 0.5 / scale),
      y: Math.round(h * 0.58 / scale),
      radius: Math.round(unit * 0.06 / scale)
    };
  }

  function runAutoDetect() {
    if (!img) return;
    const res = autoDetectAuraCenter(img);
    origin.x = res.x;
    origin.y = res.y;
    detectedAuraRadius = res.radius;
    xSlider.value = origin.x;
    ySlider.value = origin.y;
    draw();
    if (res.found) {
      showToast("1st/2nd下のオーラ中心を自動検出しました");
    } else {
      showToast("オーラを自動検出できませんでした（手動調整可）");
    }
  }

  function loadImageFromSrc(src) {
    const newImg = new Image();
    newImg.onload = () => {
      img = newImg;
      canvas.width = img.width;
      canvas.height = img.height;
      placeholder.style.display = "none";
      canvas.style.display = "block";

      xSlider.max = img.width;
      ySlider.max = img.height;

      isLocked = false;
      updateLockUI();

      runAutoDetect();
    };
    newImg.src = src;
  }

  document.getElementById("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => loadImageFromSrc(ev.target.result);
    reader.readAsDataURL(file);
  });

  document.getElementById("pasteBtn").addEventListener("click", async () => {
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        const imageType = item.types.find((t) => t.startsWith("image/"));
        if (imageType) {
          const blob = await item.getType(imageType);
          loadImageFromSrc(URL.createObjectURL(blob));
          return;
        }
      }
      alert("クリップボードに画像が見つかりませんでした。");
    } catch (err) {
      alert("貼り付けが許可されていません。「画像読込」から選択してください。");
    }
  });

  document.getElementById("autoDetectBtn").addEventListener("click", () => {
    if (!img) return;
    isLocked = false;
    updateLockUI();
    runAutoDetect();
  });

  function updateLockUI() {
    if (isLocked) {
      lockBtn.textContent = "始点ロック中（解除）";
      lockBtn.classList.add("lock-active");
    } else {
      lockBtn.textContent = "始点を固定する";
      lockBtn.classList.remove("lock-active");
